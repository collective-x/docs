# x-versioning-policy: additive-minor
#
# Versioning policy (closes Open Question 4 from 10-RESEARCH.md):
#   MINOR bumps (1.0 → 1.1): new optional request/response fields, new error codes
#     added to the enum, new optional response headers.
#   MAJOR bumps (1.x → 2.0): removed fields, changed types on existing fields, new
#     REQUIRED request fields, new REQUIRED response fields, removed error codes.
#
# Hand-written YAML (not generated). Surface is tiny; static YAML is PR-reviewable
# and beats a generator per 10-RESEARCH.md "Don't Hand-Roll" section.
# Validated by: pnpm openapi:lint (redocly lint)
