        '502':
          description: |
            The generation pipeline failed and no usable content was produced
            (empty answer, no deferral, no crisis). The body is still the
            SyncResponse envelope: use `request_id` for support correlation and
            `error.message` for display. Retry with backoff. When a PARTIAL
            answer (or a deferral/crisis short-circuit) exists alongside a
            pipeline error, the endpoint returns 200 with the optional `error`
            field populated instead. Identical mapping to `/v1/chat`'s sync mode.

            **`response_format: "structured"` gets the exact same status code
            for the exact same envelope** — `response_format` never changes
            which status this endpoint returns, only what's in the body. When
            it does, `structured_answer.status` is `"error"` and
            `structured_answer.error` carries the same message as the
            top-level `error` field; `structured_answer.sections`/`citations`
            are always empty in this state, even when a partial `answer` is
            present in the same body — a truncated generation is never
            reshaped into a claim that looks grounded.
